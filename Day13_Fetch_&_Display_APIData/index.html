
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetching API Data</title>
</head>
<body>
    <h1>API Data</h1>

    <div id="data-container" style="background-color: brown; color: white; padding: 10px;">
    </div>

    <button onclick="getApi()" id="b1">Fetch API</button>

    <script>
        function getApi() {
            fetch("https://jsonplaceholder.typicode.com/posts")
                .then(function(response) {
                    if (!response.ok) {
                        throw new Error("API request failed");
                    }
                    return response.json();
                })
                .then(function(data) {
                    var container = document.getElementById("data-container");

                    container.innerHTML = "";

                    for (var i = 0; i < 1; i++) {
                        var post = document.createElement("div");

                        post.innerHTML =
                            "<h2>" + data[i].title + "</h2>" +
                            "<p>" + data[i].body + "</p>";

                        container.appendChild(post);
                    }
                })
                .catch(function(error) {
                    console.log(error);
                    document.getElementById("data-container").textContent =
                        "Failed to fetch data. Please check your internet connection.";
                });
        }
    </script>
</body>
</html>
