Git – Version Control System

Git is a free, open-source tool used to track changes in source code.


Simple meaning: Git keeps track of every important change you make in your project.

Example:
- Day 1: Created HTML page.
- Day 2: Added CSS.

2. What is GitHub?

GitHub – Cloud-based Code Hosting Platform

GitHub allows developers to store, manage and share their Git repositories online.


Difference between Git and GitHub:
Git	GitHub
Version control tool	Online platform
Works locally	Works online
Tracks changes	Hosts repositories
Uses commits	Stores pushed commits

Website: GitHub

4. Commit
What is Commit?

A commit is a saved snapshot of your project's changes in Git.

Think of it as saving a checkpoint in your project.

Example:
git add .
git commit -m "Initial project commit"


Explanation:
- git add . – Adds changed files to the staging area.
- git commit – Saves the staged changes.
- -m – Adds a message describing the changes.
Good commit messages:
git commit -m "Add homepage"
git commit -m "Fix login page"
git commit -m "Update navbar design"


5. Push
What is Push?

Push means uploading your local commits from your computer to a remote GitHub repository.

First, open your project folder in VS Code.

Open terminal: `Ctrl + ``

Run these commands one by one:
git init


git add .


git commit -m "Initial commit"


Connect your GitHub repository:
git branch -M main


git remote add origin https://github.com/YOUR_USERNAME/day17-git-github.git


Push your code:
git push -u origin main


Replace YOUR_USERNAME with your actual GitHub username.

6. Version Control
What is Version Control?

Version control is a system that tracks changes made to files over time.

Example:

Suppose you create a website.
- Version 1 – Basic homepage.
- Version 2 – Added navbar.
- Version 3 – Added login page.
- Version 4 – Fixed CSS bugs.
Git keeps track of these changes.

Useful commands:
Command	Purpose
git status	Check file changes
git log	View commit history
git diff	See code differences
git branch	View branches
git pull	Download remote changes
git checkout	Switch branches or restore files

7. Deploy Your Project
What is Deployment?

Deployment means making your project available for other people to access over the internet.

For example, instead of running:

http://localhost:3000

Your project gets a public URL.

For deployment, the general process is:
1. Push your project to GitHub.
2. Create an account on your deployment platform.
3. Connect your GitHub account.
4. Select your repository.
5. Configure build settings and environment variables.
6. Click Deploy.
7. Get your live website URL.
Important: Never upload .env, passwords, API keys or database credentials to a public GitHub repository. Use .gitignore and the deployment platform's environment variable settings.
